# Configuración de referencia para `supabase start` (desarrollo local con Docker).
# No es necesaria para conectarte a un proyecto Supabase remoto: en ese caso
# solo necesitas las variables de entorno de .env.example.

project_id = "proyecto-web"

[api]
enabled = true
port = 54321

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true


[auth.external.google]
enabled = true
client_id = "264446420040-hqkmrd2ipfo0aa2jmo2dtuap6tthsvf6.apps.googleusercontent.com"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false